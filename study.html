<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Student-shared CA notes and CA Junction revision PDFs.">
<title>Student Notes | CA Junction</title>
<style>
:root{--bg:#080b16;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.11);--purple:#a78bfa;--text:#f4f4fb;--muted:#9ca3b8}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:82px}body{background:var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.container{width:min(950px,92%);margin:auto}
header{position:sticky;top:0;z-index:5;background:rgba(8,11,22,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:19px}.brand b{color:var(--purple)}
.hero{padding:38px 0 16px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#c4b5fd;font-weight:750}h1{font-size:clamp(30px,5vw,44px);line-height:1.15;margin:5px 0 8px}h2{font-size:22px;margin:4px 0 12px}.muted,p{color:var(--muted)}
section{padding:18px 0}.toolbar{margin:12px 0}.toolbar input{width:100%;padding:12px 14px;border:1px solid #30354d;border-radius:11px;background:#111526;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.note{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:5px}.note h3{font-size:15px}.note p,.note small{font-size:12px;color:var(--muted)}.note .link{align-self:flex-start;margin-top:5px;padding:0;border:0;background:transparent;color:#c4b5fd;font-weight:700;font-size:13px;cursor:pointer}.status{min-height:22px;color:#c4b5fd;font-size:13px;margin-top:8px}.empty{grid-column:1/-1;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);margin-top:28px;padding:20px 0;color:var(--muted);font-size:13px}:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}
[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:30px}}
</style></head>
<body data-page="study">
<header><div class="container nav"><a class="brand" href="index.html">CA <b>Junction</b></a><a href="index.html#service-heads">Services</a></div></header>
<main class="container">
<div class="hero"><div class="eyebrow">Study Material</div><h1 id="studentNotesTitle">Student notes</h1><p id="selectedLevelLabel" class="muted"></p></div>
<section id="student-notes"><h2>Notes shared by students</h2><div class="toolbar"><input id="materialSearch" type="search" placeholder="Search student notes" aria-label="Search student notes"></div><div class="grid" id="studentNotesGrid"><div class="empty">Student notes will appear here.</div></div><p id="materialStatus" class="status" role="status" aria-live="polite"></p><p style="margin-top:10px"><a class="link" href="upload.html">Contribute a PDF →</a></p></section>
<section id="admin-resources"><h2>Summary charts & mind maps</h2><div class="grid" id="adminResourcesGrid"><div class="empty">Admin revision PDFs will appear here.</div></div><p id="adminResourcesStatus" class="status" role="status" aria-live="polite"></p></section>
</main>
<footer><div class="container">© 2026 CA Junction · <a href="index.html">Home</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/backend.js"></script><script src="assets/app.js"></script>
</body></html>
