<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contribute a PDF | CA Junction</title><style>
:root{--bg:#080b16;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.11);--purple:#a78bfa;--text:#f4f4fb;--muted:#9ca3b8}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.container{width:min(760px,92%);margin:auto}header{border-bottom:1px solid var(--line)}.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:19px}.brand b{color:var(--purple)}main{padding:40px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#c4b5fd;font-weight:750}h1{font-size:clamp(30px,5vw,44px);margin:5px 0 8px}p{color:var(--muted)}.panel{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}label{display:block;color:#d7d9e5;font-size:13px;margin:10px 0 5px}input,textarea{width:100%;padding:11px 13px;border:1px solid #30354d;border-radius:10px;background:#111526;color:white}input[type=file]{padding:9px}.btn{display:inline-flex;align-items:center;border:0;border-radius:10px;padding:11px 15px;margin-top:12px;background:linear-gradient(130deg,#7c3aed,#4f46e5);color:white;font-weight:700;cursor:pointer}.status{min-height:22px;color:#c4b5fd;font-size:13px;margin-top:9px}.note{font-size:12px;margin-top:8px}.room-link{font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.timer{font-size:32px;font-variant-numeric:tabular-nums;margin:12px 0}.secondary{background:#22263a}.list{display:grid;gap:8px;margin-top:12px}.row{padding:11px;border:1px solid var(--line);border-radius:10px;color:#fff}
</style></head><body data-page="account">
<header><div class="container nav"><a class="brand" href="index.html">CA <b>Junction</b></a><a href="index.html#service-heads">Services</a></div></header><main class="container">
<div class="eyebrow">Free contribution</div><h1>Share your study notes</h1><p>Contribute a self-prepared PDF for students. The admin reviews it before sharing.</p>
<div class="panel"><form id="noteUploadForm"><input id="noteLevel" type="hidden" value="Foundation"><p class="note">Selected CA level: <strong id="uploadLevelLabel">Foundation</strong></p><label for="noteTitle">Note title</label><input id="noteTitle" maxlength="140" required placeholder="Subject and chapter"><label for="noteSubject">Subject</label><input id="noteSubject" maxlength="100" required><label for="noteContributorName">Your name (shown with the note)</label><input id="noteContributorName" maxlength="100" required autocomplete="name" placeholder="Your name"><label for="noteLinkedIn">LinkedIn profile link (optional)</label><input id="noteLinkedIn" type="url" maxlength="300" placeholder="https://www.linkedin.com/in/your-profile"><label for="noteDescription">Short description (optional)</label><input id="noteDescription" maxlength="300"><label for="notePdf">PDF file (maximum 10 MB)</label><input id="notePdf" type="file" accept="application/pdf" required><button class="btn" type="submit">Contribute PDF</button></form><p id="uploadStatus" class="status" role="status" aria-live="polite"></p></div>
</main><footer class="container" style="padding:20px 0;color:var(--muted);font-size:13px">© 2026 CA Junction</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/backend.js"></script><script src="assets/app.js"></script></body></html>
