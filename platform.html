<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | CA Junction</title>
<style>
:root{--bg:#080b16;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.11);--purple:#a78bfa;--blue:#60a5fa;--text:#f4f4fb;--muted:#9ca3b8}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 8%,rgba(124,58,237,.18),transparent 34%),radial-gradient(circle at 88% 30%,rgba(37,99,235,.13),transparent 36%)}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}.container{width:min(1120px,92%);margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(8,11,22,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;white-space:nowrap}.brand-icon{width:39px;height:39px;border:1px solid var(--line);border-radius:13px;background:rgba(167,139,250,.17);display:grid;place-items:center;color:#d2c6ff}.brand b{color:var(--purple)}
.navlinks{display:flex;align-items:center;gap:18px;font-size:13px;color:#c6c9d7}.navlinks a:hover{color:#fff}.login{padding:9px 13px;border:1px solid rgba(167,139,250,.33);border-radius:10px;background:rgba(139,92,246,.13);color:#e2d9ff;cursor:pointer}.menu{display:none;background:none;color:white;border:0;font-size:25px}
.hero{padding:54px 0 22px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#c4b5fd;font-weight:750}h1{font-size:clamp(34px,5vw,52px);letter-spacing:-1.8px;margin:7px 0}.gradient{background:linear-gradient(100deg,#c4b5fd,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}p{color:var(--muted)}
section{padding:28px 0}.sectionhead{margin-bottom:18px}.sectionhead h2{font-size:clamp(24px,4vw,34px);letter-spacing:-.8px;margin:4px 0}.sectionhead p{max-width:720px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,.panel{padding:19px;border:1px solid var(--line);border-radius:19px;background:var(--panel)}.card{transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.42)}.card h3{font-size:17px;margin:5px 0}.card p{font-size:13px}.service-link{min-height:130px;display:flex;flex-direction:column;align-items:flex-start}.service-icon{width:38px;height:38px;border:1px solid rgba(167,139,250,.22);border-radius:12px;background:rgba(167,139,250,.12);display:grid;place-items:center;font-size:20px;margin-bottom:5px}
.status{min-height:23px;color:#c4b5fd;font-size:13px;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:700;margin-top:11px;cursor:pointer}
label{display:block;color:#cbd0df;font-size:13px;margin:10px 0 5px}input,select{width:100%;padding:10px 12px;border:1px solid #30354b;border-radius:10px;background:#111526;color:#fff}.list{display:grid;gap:8px}.row{padding:12px;border:1px solid var(--line);border-radius:10px}.row strong{display:block}.row small{color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:28px;padding:24px 0 32px;color:var(--muted);font-size:13px}.dashboard-main{min-height:72vh}.profile-section{max-width:650px;margin:0 auto;padding:50px 0 70px}.profile-heading{text-align:center;margin-bottom:24px}.profile-heading h1{font-size:clamp(32px,5vw,46px);margin:6px 0}.profile-card{padding:clamp(20px,5vw,34px);border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 22px 70px rgba(0,0,0,.22)}.profile-photo-wrap{width:118px;height:118px;margin:0 auto 22px;position:relative}.profile-photo,.profile-photo-initial{width:100%;height:100%;border-radius:50%;border:2px solid rgba(196,181,253,.75);object-fit:cover;box-shadow:0 0 0 6px rgba(167,139,250,.1)}.profile-photo-initial{display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);font-size:36px;font-weight:800;color:white}.profile-help{display:block;color:var(--muted);font-size:12px;margin-top:5px}.profile-form .btn{width:100%;margin-top:18px}.profile-form input[type=file]{padding:9px}.profile-form .status{margin-bottom:0}
:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}[hidden]{display:none!important}
@media(max-width:900px){.navlinks{display:none}.menu{display:block}.navlinks.open{display:flex;position:absolute;top:72px;left:0;right:0;background:#0b0e1b;border-bottom:1px solid var(--line);padding:12px 4%;flex-direction:column;align-items:stretch;gap:0}.navlinks.open a,.navlinks.open button{text-align:left;margin:0;padding:10px}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:40px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.sectionhead{margin-bottom:14px}}
</style><link rel="stylesheet" href="assets/theme.css?v=1"><script src="assets/theme.js?v=1"></script></head>
<body data-page="dashboard">
<header><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">CA</span><span>CA <b>Junction</b></span></a><button class="menu" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="siteNav">☰</button><nav class="navlinks" id="siteNav" aria-label="Main navigation"><a href="index.html">Home</a><a href="index.html#study-material">Study Material</a><a href="index.html#test-series">Test Series</a><a href="index.html#study-planner">Study Planner</a><a href="index.html#career-hub">Career Hub</a><button class="login" id="signOutButton" type="button">Sign out</button></nav></div></header>
<main class="container dashboard-main">
<section class="profile-section">
 <div class="profile-heading"><div class="eyebrow">Your account</div><h1>Your Profile</h1><p>Update your photo, name and CA level.</p></div>
 <div class="profile-card">
  <div class="profile-photo-wrap"><img id="profilePhotoPreview" class="profile-photo" alt="Your profile photo" hidden><span id="profilePhotoInitial" class="profile-photo-initial" aria-hidden="true">CA</span></div>
  <form id="profileForm" class="profile-form">
   <label class="photo-label" for="profilePhoto">Profile photo</label>
   <input id="profilePhoto" type="file" accept="image/png,image/jpeg,image/webp">
   <small class="profile-help">Choose a JPG, PNG or WebP image. It will be resized automatically.</small>
   <label for="profileName">Name</label><input id="profileName" maxlength="100" autocomplete="name" required>
   <label for="profileLevel">CA level</label><select id="profileLevel"><option>Foundation</option><option>Intermediate</option><option>Final</option><option>Qualified</option></select>
   <button class="btn" type="submit">Save profile</button>
   <p id="profileStatus" class="status" role="status" aria-live="polite"></p>
  </form>
 </div>
</section>
</main>
<footer><div class="container">© 2026 CA Junction · <a href="index.html">Home</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/backend.js"></script><script src="assets/app.js"></script>
</body></html>
