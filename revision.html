<style>
:root{--bg:#080b16;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.11);--purple:#a78bfa;--text:#f4f4fb;--muted:#9ca3b8}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.container{width:min(950px,92%);margin:auto}
header{position:sticky;top:0;z-index:5;background:rgba(8,11,22,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:19px}.brand b{color:var(--purple)}
.hero{padding:38px 0 16px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#c4b5fd;font-weight:750}h1{font-size:clamp(30px,5vw,44px);line-height:1.15;margin:5px 0 8px}h2{font-size:22px;margin:4px 0 12px}p{color:var(--muted)}
section{padding:18px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.note{min-height:150px;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;gap:7px}.note h3{font-size:15px}.resource-access{font-size:11px;font-weight:750;padding:2px 8px;border-radius:99px}.resource-access.premium{color:#fcd34d;background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.25)}.note p,.note small{font-size:12px;color:var(--muted)}.note .link{align-self:flex-start;margin-top:5px;color:#c4b5fd;font-weight:700;font-size:13px}.status{min-height:22px;color:#c4b5fd;font-size:13px;margin-top:8px}.empty{grid-column:1/-1;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);margin-top:28px;padding:20px 0;color:var(--muted);font-size:13px}:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:30px}}
</style>
</head>
